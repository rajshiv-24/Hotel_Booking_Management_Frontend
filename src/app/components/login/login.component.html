<div class="auth-bg">
  <div class="auth-card card">
    <div class="auth-header">
      <div style="font-size:3rem;">🏨</div>
      <h2 class="fw-bold mt-2 mb-1">LuxeStay</h2>
      <p class="mb-0 opacity-75">Sign in to your account</p>
    </div>
    <div class="card-body p-4">

      <div *ngIf="errorMsg" class="alert alert-danger d-flex align-items-center gap-2">
        <i class="bi bi-exclamation-triangle-fill"></i> {{ errorMsg }}
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label fw-semibold">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
            <input type="email" class="form-control border-start-0"
                   formControlName="email" placeholder="you@example.com"
                   [class.is-invalid]="f['email'].touched && f['email'].invalid">
          </div>
          <div class="text-danger small mt-1" *ngIf="f['email'].touched && f['email'].invalid">
            Valid email is required.
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
            <input [type]="showPass ? 'text' : 'password'"
                   class="form-control border-start-0 border-end-0"
                   formControlName="password" placeholder="••••••••"
                   [class.is-invalid]="f['password'].touched && f['password'].invalid">
            <button class="btn btn-outline-secondary border-start-0" type="button"
                    (click)="showPass=!showPass">
              <i class="bi" [class.bi-eye]="!showPass" [class.bi-eye-slash]="showPass"></i>
            </button>
          </div>
          <div class="text-danger small mt-1" *ngIf="f['password'].touched && f['password'].invalid">
            Password is required.
          </div>
        </div>

        <button type="submit" class="btn btn-hotel w-100 py-2 mb-3" [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          {{ loading ? 'Signing in...' : 'Sign In' }}
        </button>
      </form>

      <p class="text-center text-muted small mb-2">
        Don't have an account?
        <a routerLink="/register" class="fw-bold text-decoration-none">Register here</a>
      </p>
      <div class="alert alert-light border text-center small py-2 mb-0">
        <i class="bi bi-shield-lock me-1"></i>
        <strong>Admin:</strong> admin&#64;hotel.com / admin123
      </div>

    </div>
  </div>
</div>
