<nav class="navbar navbar-expand-lg main-navbar" *ngIf="auth.isLoggedIn()">
  <div class="container">
    <a class="navbar-brand" routerLink="/home">🏨 LuxeStay</a>
    <button class="navbar-toggler border-0" type="button"
            data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">

      <ul class="navbar-nav me-auto gap-1" *ngIf="!auth.isAdmin()">
        <li class="nav-item">
          <a class="nav-link" routerLink="/home" routerLinkActive="active"
             [routerLinkActiveOptions]="{exact:true}">
            <i class="bi bi-house-door me-1"></i>Home
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/rooms" routerLinkActive="active">
            <i class="bi bi-door-open me-1"></i>Rooms
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/my-bookings" routerLinkActive="active">
            <i class="bi bi-calendar-check me-1"></i>My Bookings
          </a>
        </li>
      </ul>

      <ul class="navbar-nav me-auto gap-1" *ngIf="auth.isAdmin()">
        <li class="nav-item">
          <a class="nav-link" routerLink="/admin" routerLinkActive="active"
             [routerLinkActiveOptions]="{exact:true}">
            <i class="bi bi-speedometer2 me-1"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/admin/rooms" routerLinkActive="active">
            <i class="bi bi-door-open me-1"></i>Rooms
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/admin/bookings" routerLinkActive="active">
            <i class="bi bi-journal-text me-1"></i>Bookings
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/admin/customers" routerLinkActive="active">
            <i class="bi bi-people me-1"></i>Customers
          </a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-3">
        <span class="text-white-50 small">
          <i class="bi bi-person-circle me-1"></i>{{ auth.getFullName() }}
          <span class="badge ms-1"
                [class.bg-warning]="auth.isAdmin()"
                [class.text-dark]="auth.isAdmin()"
                [class.bg-success]="!auth.isAdmin()">
            {{ auth.getRole() }}
          </span>
        </span>
        <button class="btn btn-outline-light btn-sm px-3" (click)="auth.logout()">
          <i class="bi bi-box-arrow-right me-1"></i>Logout
        </button>
      </div>

    </div>
  </div>
</nav>
